<div class="card" *ngIf="getstdInfo.length>0;else nostd">
    <div class="card-header">
        <strong class="text-primary">STUDENT INFO :-</strong>
    </div>
    <div class="card-body">
        <table class="table table-bordered table-striped text-center">
            <thead>
                <tr>
                    <th>SR.NO</th>
                    <th>FULL NAME</th>
                    <th>EMAIL</th>
                    <th>CONTACT</th>
                    <th>EDIT</th>
                    <th>DELETE</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let std of getstdInfo,index as i">
                    <td>{{i+1}}</td>
                    <td>{{std.fname}} {{std.lname}}</td>
                    <td>{{std.email}}</td>
                    <td>{{std.contact}}</td>
                    <td><button 
                        (click)="onedit(std)"
                        class="bg-primary text-warning"><mat-icon>edit</mat-icon></button></td>

                    <td><button 
                        (click)="ondelete(std.stdId)"
                        class="bg-danger"><mat-icon>delete</mat-icon></button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<ng-template #nostd>
    <p class="alert alert-warning">
        NO STUDENT INFO FOUND CURRENTY !!!
    </p>
</ng-template>
