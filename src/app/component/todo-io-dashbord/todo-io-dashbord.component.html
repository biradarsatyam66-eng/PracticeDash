<div class="row">
    <div class="col-md-6">
        <app-todo-io-form
        (emitnewtodo)="ongettodo($event)"
        [edittodoObj]="editObj"
        (emitupdateobj)="onupdatetodo($event)"
        ></app-todo-io-form>
    </div>

    <div class="col-md-6">
        <app-todo-io-list
        [todoitem]="todoarr"
        (emitremoveId)="getremoveId($event)"
        (emiteditobj)="geteditobj($event)"
        ></app-todo-io-list>
    </div>
</div>
