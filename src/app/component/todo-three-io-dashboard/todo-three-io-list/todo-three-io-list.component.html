<div class="card">
    <div class="card-header">
        <strong>
            TODO INFO :-
        </strong>
    </div>
    <div class="card-body">
        <ul class="list-group" *ngIf="gettodoinfo.length>0;else notodo">
            <li 
            *ngFor="let todo of gettodoinfo"
            class="list-group-item d-flex justify-content-between font-weight-bold">{{todo.todoitem}}

                <div>
                    <button 
                    (click)="onedit(todo)"
                    mat-button color="primary"><mat-icon>edit</mat-icon></button>

                    <button 
                    (click)="ondelete(todo.todoid)"
                    mat-button color="warn"><mat-icon>delete</mat-icon></button>
                </div>
            </li>
        </ul>
    </div>
</div>

<ng-template #notodo>
    <p class="alert alert-warning">
        NO TODO FOUND CURRENTLY !!!!
    </p>
</ng-template>
