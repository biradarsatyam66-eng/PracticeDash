<div class="card">
    <div class="card-header">
        <h2 class="m-0 text-primary font-weight-bold text-center">{{isinEditMode?'UPDATE TODO':'ADD TODO'}}</h2>
    </div>
    <div class="card-body">
        <form #todoform="ngForm" (ngSubmit)="onAddtodo()">
            <div class="form-group">
                <label for="todoitem" class="font-weight-bold">TODO ITEM :-</label>
                <input 
                required
                ngModel
                name="todoitem"
                type="text" class="form-control">
            </div>
            <p *ngIf="isInvalid" class="text-danger">
                Please enter valid info !!!!
            </p>


            <div>
                <button 
                *ngIf="!isinEditMode"
                mat-raised-button color="primary" class="btn-block">ADD TODO</button>

                <button 
                *ngIf="isinEditMode"
                (click)="onupdate()"
                mat-raised-button color="accent" class="btn-block">UPDATE TODO</button>
            </div>
        </form>
    </div>
</div>
