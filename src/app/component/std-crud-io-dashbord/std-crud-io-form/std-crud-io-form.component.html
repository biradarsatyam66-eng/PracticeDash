<div class="card shadow-lg">
    <div class="card-header">
        <h1 class="text-center text-primary font-weight-bold">{{isinEditMode?'UPDATE STD':'ADD STD'}}</h1>
    </div>
    <div class="card-body">
        <form #stdForm="ngForm" (ngSubmit)="onstdAdd()">
            <div class="form-group">
                <label for="fname">FIRST NAME :-</label>
                <input 
                ngModel
                name="fname"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="lname">LAST NAME :-</label>
                <input 
                ngModel
                name="lname"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="email">EMAIL :-</label>
                <input 
                ngModel
                name="email"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="contact">CONTACT :-</label>
                <input
                ngModel 
                name="contact"
                type="text" class="form-control">
            </div>

            <div>
                <button 
                *ngIf="!isinEditMode"
                mat-raised-button color="primary" class="btn-block">ADD STD</button>

                <button 
                *ngIf="isinEditMode"
                (click)="onstdUpdate()"
                mat-raised-button color="accent" class="btn-block">UPDATE STD</button>
            </div>
        </form>
    </div>
</div>
